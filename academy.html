<html lang="ru">

  <title>Памятка SANG — Military Academy</title>

  <style>
    :root {
      --bg: #0b100c;
      --panel: #121a13;
      --panel-2: #172017;
      --line: rgba(190, 164, 102, .19);
      --gold: #c5a665;
      --gold-bright: #e2c783;
      --text: #f0f0e9;
      --muted: #a4aa9d;
      --green: #788b62;
      --red: #c47c68;
      --radius: 13px;
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(ellipse at 78% 0%, rgba(117, 133, 83, .13), transparent 34rem),
        radial-gradient(ellipse at 0% 55%, rgba(181, 147, 79, .055), transparent 32rem),
        var(--bg);
      font-family: "Manrope", sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* HEADER */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 16, 12, .88);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .header-inner {
      width: min(var(--max), calc(100% - 44px));
      min-height: 78px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(197, 166, 101, .55);
      color: var(--gold-bright);
      font-size: 20px;
      transform: rotate(45deg);
      border-radius: 8px;
    }

    .brand-mark span {
      transform: rotate(-45deg);
    }

    .brand-copy strong {
      display: block;
      font: 800 25px/1 "Barlow Condensed", sans-serif;
      letter-spacing: .13em;
    }

    .brand-copy small {
      display: block;
      margin-top: 5px;
      color: var(--gold);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .24em;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav-link {
      color: #aeb4a8;
      font-size: 12px;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: 7px;
      text-transform: uppercase;
      letter-spacing: .04em;
      transition: .2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--gold-bright);
      background: rgba(197, 166, 101, .09);
    }

    .menu-toggle {
      display: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--gold-bright);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }

    /* PAGE & BANNERS */
    .page-section {
      padding-bottom: 60px;
    }

    .page-banner {
      width: 100%;
      background: linear-gradient(180deg, rgba(24, 34, 25, .65), rgba(11, 16, 12, 0));
      border-bottom: 1px solid var(--line);
      padding: 64px 0 40px;
    }

    .page-banner-inner {
      width: min(var(--max), calc(100% - 44px));
      margin: 0 auto;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      color: var(--gold);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .eyebrow:before {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--gold);
    }

    .page-banner h2 {
      margin: 14px 0 10px;
      font: 700 clamp(40px, 5.5vw, 62px)/1 "Barlow Condensed", sans-serif;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: var(--text);
    }

    .page-banner p:last-child {
      margin: 0;
      color: #b8beb1;
      font-size: 14px;
      max-width: 680px;
    }

    .section-wrap {
      width: min(var(--max), calc(100% - 44px));
      margin: 44px auto 0;
    }

    .section-heading.left {
      display: block;
      margin-bottom: 28px;
    }

    .section-heading.left h2 {
      margin: 12px 0 10px;
      font: 700 34px/1.1 "Barlow Condensed", sans-serif;
      letter-spacing: .02em;
    }

    .section-heading.left p:last-child {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      max-width: 760px;
    }

    /* INFO CARDS (ABOUT MA) */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 44px;
    }

    .info-card {
      position: relative;
      padding: 24px 26px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(24, 34, 25, .96), rgba(16, 23, 17, .96));
    }
