<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101610">
  <meta name="description" content="Руководящий состав Military Academy — San Andreas National Guard.">
  <title>Руководство | SANG Military Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b100c;
      --panel: #121a13;
      --panel-2: #172017;
      --line: rgba(190, 164, 102, .19);
      --gold: #c5a665;
      --gold-bright: #e2c783;
      --text: #f0f0e9;
      --muted: #a4aa9d;
      --green: #788b62;
      --red: #c47c68;
      --radius: 13px;
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(ellipse at 78% 0%, rgba(117, 133, 83, .13), transparent 34rem),
        radial-gradient(ellipse at 0% 55%, rgba(181, 147, 79, .055), transparent 32rem),
        var(--bg);
      font-family: "Manrope", sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* HEADER */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 16, 12, .88);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .header-inner {
      width: min(var(--max), calc(100% - 44px));
      min-height: 78px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(197, 166, 101, .55);
      color: var(--gold-bright);
      font-size: 20px;
      transform: rotate(45deg);
      border-radius: 8px;
    }

    .brand-mark span {
      transform: rotate(-45deg);
    }

    .brand-copy strong {
      display: block;
      font: 800 25px/1 "Barlow Condensed", sans-serif;
      letter-spacing: .13em;
    }

    .brand-copy small {
      display: block;
      margin-top: 5px;
      color: var(--gold);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .24em;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav-link {
      color: #aeb4a8;
      font-size: 12px;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: 7px;
      text-transform: uppercase;
      letter-spacing: .04em;
      transition: .2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--gold-bright);
      background: rgba(197, 166, 101, .09);
    }

    .menu-toggle {
      display: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--gold-bright);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }

    /* PAGE & BANNERS */
    .page-section {
      padding-bottom: 70px;
    }
